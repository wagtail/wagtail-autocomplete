[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-autocomplete"
dynamic = ["version"]
description = "An Autocomplete edit handler for Pages, Snippets, and more."
readme = "README.rst"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Emily Horsman and Harris Lapiroff", email = "me@emilyhorsman.com" },
]
urls = { Homepage = "https://github.com/wagtail/wagtail-autocomplete" }
dependencies = [
    "wagtail>=6.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 6",
    "Framework :: Wagtail :: 7",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.optional-dependencies]
docs = [
    "Sphinx>=1.7",
    "sphinx_rtd_theme>=0.4.0",
]
test = [
    "tox",
    "pytest>=3.5",
    "pytest-django>=3.2",
    "beautifulsoup4>=4.8",
    "html5lib>=0.999999999",
    "pytest-pythonpath>=0.7.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wagtailautocomplete*"]

[tool.setuptools.dynamic]
version = { attr = "wagtailautocomplete.__version__" }

[tool.pytest.ini_options]
testpaths = ["wagtailautocomplete", "docs"]
DJANGO_SETTINGS_MODULE = "wagtailautocomplete.tests.settings"
django_find_project = false
