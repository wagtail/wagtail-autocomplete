---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Enforce end of file format
        # Exclude webpack output
        exclude: '^wagtailautocomplete/static/wagtailautocomplete/dist\.'

      - id: trailing-whitespace
        name: Enforce removal of trailing whitespace
        # Exclude webpack output
        exclude: '^wagtailautocomplete/static/wagtailautocomplete/dist\.'

      - id: mixed-line-ending
        args: [--fix=lf]
        # Keep CRLF in Windows batch files; exclude webpack output
        exclude: '\.bat$|^wagtailautocomplete/static/wagtailautocomplete/dist\.'

      - id: fix-byte-order-marker

      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
